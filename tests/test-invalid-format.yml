name: Test invalid parameterPairs format fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMIK7MDENGbPxRfiCYEXAMPLEKEY
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start mock SSM endpoint
        run: bash "$GITHUB_WORKSPACE/tests/fixtures/setup-mock-ssm.sh"
      - id: action
        uses: .
        continue-on-error: true
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          NODE_EXTRA_CA_CERTS: /tmp/mock-ssm/cert.pem
        with:
          parameterPairs: /valid/param=VALID_VAR,no-equals-sign
      - name: Assert action failed before calling SSM
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for malformed parameterPairs"
            exit 1
          fi
          COUNT=$(grep -c . /tmp/mock-ssm/requests.log || true)
          echo "requests: $COUNT"
          if [ "$COUNT" != "0" ]; then
            echo "FAIL: action should fail validation before any SSM request"
            exit 1
          fi
          if [ -n "${VALID_VAR+x}" ]; then
            echo "FAIL: VALID_VAR should not be exported"
            exit 1
          fi
          echo "PASS"
