name: Test valid pairs with invalid AWS credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_MAX_ATTEMPTS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          parameterPairs: "/actionchain/test/one = TEST_ONE, /actionchain/test/two=TEST_TWO"
      - name: Assert action failed at AWS call without exporting variables
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "TEST_ONE: '${TEST_ONE:-}' TEST_TWO: '${TEST_TWO:-}'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with invalid AWS credentials, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "${TEST_ONE:-}" ] || [ -n "${TEST_TWO:-}" ]; then
            echo "FAIL: no env vars should be exported on AWS failure"
            exit 1
          fi
          echo "PASS"
