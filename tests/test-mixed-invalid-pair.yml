name: Test list with one malformed pair
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          parameterPairs: "/ssm/good=GOOD_VAR, /ssm/bad"
      - name: Assert action failed and exported nothing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "GOOD_VAR: '${GOOD_VAR:-}'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when any pair is malformed"
            exit 1
          fi
          if [ -n "${GOOD_VAR:-}" ]; then
            echo "FAIL: GOOD_VAR should not be exported when validation fails"
            exit 1
          fi
          echo "PASS"
